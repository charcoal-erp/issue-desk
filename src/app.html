<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<script>
			// Applied before first paint: a theme decided after hydration would show
			// one frame of the wrong one. "system" stores nothing and follows the OS.
			try {
				var t = localStorage.getItem('issuedesk_theme');
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
